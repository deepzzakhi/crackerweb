services:
  - type: web
    name: crackerweb-backend
    runtime: node
    rootDir: backend
    # --include=dev: con NODE_ENV=production npm saltea TypeScript y Prisma CLI, y el build falla
    buildCommand: npm ci --include=dev && npx prisma generate && npm run build
    # El seed es idempotente: crea admins, tipos de reunión y horario solo si faltan
    startCommand: npx prisma migrate deploy && npm run db:seed && node dist/server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY
        value: "1"
      - key: DEMO_MODE
        value: "true"
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_URL
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: CHAT_MODEL
        value: claude-opus-5-5
      - key: ADMIN_EMAILS
        value: crackersoftware@gmail.com,alexisplescia@gmail.com
      - key: MAIL_PROVIDER
        value: log
      - key: RESEND_API_KEY
        sync: false
