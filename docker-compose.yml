version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: cracker-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: cracker
      # La contraseña sale del .env de la raíz (no se sube al repo)
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Definí POSTGRES_PASSWORD en el .env}
      POSTGRES_DB: cracker_db
    # Solo localhost: la DB nunca debe quedar expuesta a internet.
    # En producción usar una DB gestionada (Neon/Supabase) con TLS.
    ports:
      - '127.0.0.1:5435:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U cracker -d cracker_db']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
