version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: cracker-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: cracker
      POSTGRES_PASSWORD: "*****"
      POSTGRES_DB: cracker_db
    ports:
      - '5435:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U cracker -d cracker_db']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
